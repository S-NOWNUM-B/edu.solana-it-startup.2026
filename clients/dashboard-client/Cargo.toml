[package]
name = "dashboard-client"
version = "0.1.0"
description = "Local RPC dashboard for SNOWNUMB TOKEN"
edition = "2021"

[dependencies]
async-trait = "=0.1.92"
serde_json = "=1.0.151"
solana-commitment-config = "=3.0.0"
solana-pubkey = "=3.0.0"
solana-rpc-client = { version = "=3.1.14", default-features = false }
solana-rpc-client-api = "=3.1.14"
tiny_http = "=0.12.0"
tokio = { version = "=1.53.1", features = ["time"] }
