[package]
name = "payments-client"
version = "0.1.0"
description = "Local noncustodial USDC invoice application for Solana devnet"
edition = "2021"

[dependencies]
async-trait = "=0.1.92"
bs58 = "=0.5.1"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
solana-commitment-config = "=3.0.0"
solana-keypair = "=3.1.2"
solana-pubkey = "=3.0.0"
solana-rpc-client = { version = "=3.1.14", default-features = false }
solana-rpc-client-api = "=3.1.14"
solana-signer = "=3.0.0"
spl-associated-token-account-interface = "=2.0.0"
tiny_http = "=0.12.0"
tokio = { version = "=1.53.1", features = ["time"] }
