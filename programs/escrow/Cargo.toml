[package]
name = "escrow"
version = "0.1.0"
description = "Minimal sender-controlled Token-2022 escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"
anchor-spl = { version = "=1.1.2", features = ["associated_token", "token_2022"] }

[dev-dependencies]
litesvm = "=0.10.0"
solana-keypair = "=3.1.2"
solana-message = "=3.0.1"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
