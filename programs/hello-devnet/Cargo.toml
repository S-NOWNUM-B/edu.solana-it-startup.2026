[package]
name = "hello-devnet"
version = "0.1.0"
description = "First Solana program deployed to Devnet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hello_devnet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"

[dev-dependencies]
litesvm = "=0.10.0"
solana-keypair = "=3.1.2"
solana-message = "=3.0.1"
solana-signer = "=3.0.0"
solana-transaction = "=3.0.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
