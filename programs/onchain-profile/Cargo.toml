[package]
name = "onchain-profile"
version = "0.1.0"
description = "Anchor profile stored in one PDA per wallet"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "onchain_profile"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
